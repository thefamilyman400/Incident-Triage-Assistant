version: 0.0

os: linux

files:
  - source: /
    destination: /opt/triage-assistant

hooks:
  ApplicationStop:
    - location: scripts/codedeploy/stop.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/codedeploy/start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/codedeploy/validate.sh
      timeout: 180
      runas: root