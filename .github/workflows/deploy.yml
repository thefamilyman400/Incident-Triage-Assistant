name: Deploy Incident Triage Assistant

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "❌ EC2_HOST is EMPTY"
          else
            echo "✅ EC2_HOST is present"
          fi

          if [ -z "$EC2_USER" ]; then
            echo "❌ EC2_USER is EMPTY"
          else
            echo "✅ EC2_USER is present"
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "❌ EC2_SSH_KEY is EMPTY"
          else
            echo "✅ EC2_SSH_KEY is present"
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Incident-Triage-Assistant
            git pull origin main
            docker compose build
            docker compose up -d
            docker compose ps